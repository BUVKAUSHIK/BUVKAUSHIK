name: Substack Blog Posts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC

jobs:
  update_blogs:
    name: Fetch Latest Substack Posts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Substack RSS feed
        run: |
          curl -s -L \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/rss+xml, application/xml, text/xml, */*" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -H "Accept-Encoding: gzip, deflate, br" \
            -H "DNT: 1" \
            -H "Connection: keep-alive" \
            -H "Upgrade-Insecure-Requests: 1" \
            -b "/tmp/cookies.txt" -c "/tmp/cookies.txt" \
            --compressed \
            --retry 3 \
            --retry-delay 5 \
            -o /tmp/substack-feed.xml \
            "https://uvabolla.substack.com/feed"
          
          # Verify we got XML, not HTML
          if head -1 /tmp/substack-feed.xml | grep -q "<!DOCTYPE html"; then
            echo "❌ Failed: Got HTML instead of RSS feed (Cloudflare block detected)"
            exit 1
          fi

      - name: Parse and update README
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import re
          from datetime import datetime

          # Read and sanitize the XML
          with open('/tmp/substack-feed.xml', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Fix common XML issues
          content = re.sub(r'&(?!(?:apos|quot|amp|lt|gt|#[0-9]+|#x[0-9a-fA-F]+);)', '&amp;', content)
          
          try:
              root = ET.fromstring(content)
          except ET.ParseError as e:
              print(f"XML Parse Error: {e}")
              print(f"First 1000 chars: {content[:1000]}")
              exit(1)
          
          channel = root.find('channel')
          if channel is None:
              print("Error: No channel found in RSS feed")
              exit(1)
          
          items = channel.findall('item')

          posts = []
          for item in items[:5]:
              title_elem = item.find('title')
              link_elem = item.find('link')
              pub_date_elem = item.find('pubDate')
              
              if title_elem is None or link_elem is None or pub_date_elem is None:
                  continue
              
              title = title_elem.text.strip() if title_elem.text else "Untitled"
              link = link_elem.text.strip() if link_elem.text else ""
              pub_date = pub_date_elem.text.strip() if pub_date_elem.text else ""
              
              try:
                  dt = datetime.strptime(pub_date, "%a, %d %b %Y %H:%M:%S %Z")
                  formatted_date = dt.strftime("%b %d, %Y")
              except:
                  formatted_date = pub_date
              
              if title and link:
                  posts.append(f"- [{title}]({link}) — *{formatted_date}*")

          blog_section = "\n".join(posts)

          with open('README.md', 'r') as f:
              content = f.read()

          pattern = r'(<!-- BLOG-POST-LIST:START -->).*?(<!-- BLOG-POST-LIST:END -->)'
          replacement = f'\\1\n{blog_section}\n\\2'
          new_content = re.sub(pattern, replacement, content, flags=re.DOTALL)

          with open('README.md', 'w') as f:
              f.write(new_content)

          print("✅ Updated README with posts:")
          for p in posts:
              print(p)
          EOF

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git diff --quiet && exit 0 || true
          git add README.md
          git commit -m "chore: update blog posts from Substack"
          git push
